<svg xmlns="http://www.w3.org/2000/svg" width="150" height="100" viewBox="0 0 150 100">
  <defs>
    <radialGradient id="fireGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#ffff00;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#ff6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000066;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="150" height="100" fill="url(#skyGrad)"/>
  
  <!-- Stars -->
  <circle cx="20" cy="20" r="1" fill="white" opacity="0.8"/>
  <circle cx="130" cy="15" r="1" fill="white" opacity="0.8"/>
  <circle cx="40" cy="30" r="1.5" fill="white" opacity="0.9"/>
  <circle cx="110" cy="25" r="1" fill="white" opacity="0.7"/>
  <circle cx="90" cy="10" r="1" fill="white" opacity="0.8"/>
  
  <!-- Phoenix body -->
  <ellipse cx="75" cy="50" rx="15" ry="25" fill="url(#fireGrad)" transform="rotate(-10 75 50)"/>
  
  <!-- Phoenix wings -->
  <path d="M60,50 Q30,40 20,50 Q30,55 40,50 Q50,45 60,50" fill="url(#fireGrad)" opacity="0.9"/>
  <path d="M90,50 Q120,40 130,50 Q120,55 110,50 Q100,45 90,50" fill="url(#fireGrad)" opacity="0.9"/>
  
  <!-- Phoenix head -->
  <circle cx="75" cy="35" r="8" fill="#ff6600"/>
  <path d="M75,27 L72,20 L75,24 L78,20 Z" fill="#ffff00"/>
  
  <!-- Phoenix tail -->
  <path d="M75,65 Q70,80 65,90 L75,85 L85,90 Q80,80 75,65" fill="url(#fireGrad)" opacity="0.8"/>
  

</svg>